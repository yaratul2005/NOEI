# .gitlab-ci.yml - Automated CI/CD for NOEI CMS on GitLab
image: php:8.2-cli

services:
  - name: mariadb:10.6
    alias: mysql
    variables:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: noei_test
      MYSQL_USER: noei_user
      MYSQL_PASSWORD: secret_password

variables:
  MYSQL_HOST: mysql
  MYSQL_DATABASE: noei_test
  MYSQL_USER: noei_user
  MYSQL_PASSWORD: secret_password

stages:
  - lint
  - test
  - release

# Stage 1: PHP Syntax Linting
lint:php:
  stage: lint
  script:
    - find . -name "*.php" -not -path "./storage/*" -not -path "./NOEI/*" -exec php -l {} \;

# Stage 2: Automated Test Execution
test:unit:
  stage: test
  before_script:
    - apt-get update && apt-get install -y libpng-dev libjpeg-dev libzip-dev default-mysql-client
    - docker-php-ext-configure gd --with-jpeg
    - docker-php-ext-install pdo pdo_mysql gd zip
  script:
    - php tests/test_core.php
    - php tests/test_milestone2.php
    - php tests/test_milestone3.php
    - php tests/test_milestone4.php
    - php tests/test_milestone5.php
    - php tests/test_milestone6.php
    - php tests/test_milestone7.php
    - php tests/test_milestone8.php
    - php tests/test_milestone9.php
    - php tests/test_milestone10.php
    - php tests/test_platform_upgrade.php

# Stage 3: Package Release ZIP on Tags
package:release:
  stage: release
  only:
    - tags
  before_script:
    - apt-get update && apt-get install -y libzip-dev zip
    - docker-php-ext-install zip
  script:
    - php tools/build-release.php
  artifacts:
    name: "noei-cms-$CI_COMMIT_TAG"
    paths:
      - dist/*.zip
    expire_in: 30 days